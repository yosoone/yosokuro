<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Yosokuro</title>
<link rel="canonical" href="https://kuro.yoso.one/">
<script>
/* The full-screen version is now the home page: forward, keeping ?order=… and #frame */
location.replace("./" + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=./">
<style>
  body { margin: 0; background: #000; color: #ddd; font: 15px/1.8 "Zen Kaku Gothic New", system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 20px 20px 40px; }
  .family-mark { display: block; width: 48px; margin: 0 auto 32px; line-height: 0; }
  .family-mark img { display: block; width: 48px; height: 48px; }
  a { color: #e3bb4a; }
  a:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid #e3bb4a; outline-offset: 2px; }
  label, legend, footer { font: 12px "IBM Plex Mono", monospace; letter-spacing: .12em; }
  input[type=email] { width: 100%; box-sizing: border-box; min-height: 44px; background: #111; color: #ddd; border: 1px solid #444; padding: 0 10px; }
  button { min-height: 44px; margin-top: 8px; padding: 0 18px; background: #e3bb4a; color: #000; border: 0; }
  fieldset { border: 0; padding: 0; margin: 12px 0; }
  .lc-box { display: block; margin: 6px 0; }
  .lc-desc { display: block; color: #888; }
  footer { margin-top: 40px; color: #888; }
</style>
</head>
<body>
<main>
  <a class="family-mark" href="https://hub.yoso.one"><img src="images/yoso-mark.png" alt="Yoso" width="48" height="48"></a>
  <p>Yosokuro has moved to <a href="./">kuro.yoso.one</a>.</p>
  <form action="https://buttondown.com/api/emails/embed-subscribe/yoso" method="post" target="_blank">
    <label for="list-email">Email address</label>
    <div class="list-row">
      <input id="list-email" name="email" type="email" autocomplete="email" required>
      <button type="submit">Subscribe</button>
    </div>
    <fieldset class="list-choice" data-list-choice>
      <legend>Which newsletters would you like?</legend>
      <label class="lc-box"><input type="checkbox" name="tag" value="one"><span><span class="lc-name">One</span><span class="lc-desc">Notes, essays and research from one.yoso.one</span></span></label>
      <label class="lc-box"><input type="checkbox" name="tag" value="yosokuro" checked><span><span class="lc-name">Yosokuro</span><span class="lc-desc">Black-and-white photographs of Japan</span></span></label>
      <label class="lc-box"><input type="checkbox" name="tag" value="shinsei"><span><span class="lc-name">Shinsei</span><span class="lc-desc">New paintings, scrolls and exhibitions</span></span></label>
      <label class="lc-box"><input type="checkbox" name="tag" value="river"><span><span class="lc-name">River</span><span class="lc-desc">New short texts</span></span></label>
      <label class="lc-box"><input type="checkbox" name="tag" value="on"><span><span class="lc-name">On</span><span class="lc-desc">Each numbered issue of the magazine</span></span></label>
    </fieldset>
    <input type="hidden" name="embed" value="1">
    <p>Sent through Buttondown. Confirm by email; unsubscribe any time.</p>
  </form>
  <footer>&copy; 2026 <a class="hub-link" href="https://hub.yoso.one">Yoso</a> · <span class="version" data-version>Beta 0.99</span></footer>
</main>
<script src="assets/list-choice.js" defer></script>
</body>
</html>
